include:
  - local: ci/jobs.yml

stages:
  - validate
  - test
  - build
  - deploy

variables:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

validate_source:
  extends: .python_job
  stage: validate
  script:
    - python -m compileall -q src tests
    - PYTHONPATH=src python -m incident_summary.cli --help

unit_tests:
  extends: .python_job
  stage: test
  script:
    - PYTHONPATH=src python -m unittest discover -s tests -v

build_report:
  extends: .python_job
  stage: build
  script:
    - mkdir -p build
    - PYTHONPATH=src python -m incident_summary.cli examples/incidents.json --json build/summary.json --html build/index.html --as-of 2026-09-21T00:00:00Z
  artifacts:
    name: "incident-report-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - build/summary.json
      - build/index.html

pages:
  extends: .python_job
  stage: deploy
  needs:
    - job: build_report
      artifacts: true
  script:
    - mkdir -p public
    - cp build/index.html public/index.html
    - cp build/summary.json public/summary.json
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
